name: Bug report
description: Report a reproducible problem.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include personal information or credentials. Report vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and version
  - type: textarea
    id: context
    attributes:
      label: Additional context
